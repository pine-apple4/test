<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>캘빈의 광합성 실험</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>
<!-- =========================
     INTRO
========================= -->

<div id="intro">

    <div class="intro-card">

        <h2>종이 크로마토그래피</h2>

        <p class="intro-text">
            혼합물을 종이에 떨어뜨린 뒤 용매를 흘려 보내면
            물질마다 이동하는 속도가 달라 서로 분리됩니다.
        </p>

<div class="student-input">
    <label for="studentName">이름</label>
    <input
        id="studentName"
        type="text"
        placeholder="이름을 입력하세요">
</div>

<div class="paper">
    <div class="rotation-layer">
        <!-- 원점 -->
        <div class="origin">
            <div class="sample"></div>
        </div>
        <!-- 1차 전개 용매 -->
        <div class="solvent first"></div>
        <!-- 1차 전개 후 분리된 물질 -->
        <div class="first-spot spot-a"></div>
        <div class="first-spot spot-b"></div>
        <div class="first-spot spot-c"></div>
        <!-- 2차 전개 용매 -->
        <div class="solvent second"></div>
        <!-- 최종 분리된 물질 -->
        <div class="final-spot final-a"></div>
        <div class="final-spot final-b"></div>
        <div class="final-spot final-c"></div>
        <div class="final-spot final-d"></div>
    </div>
</div>
        <p id="intro-caption">
            시료를 종이 아래쪽에 떨어뜨립니다.
        </p>

        <button id="startBtn" hidden>
            실험 시작
        </button>

    </div>

</div>
<div class="container hidden">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>캘빈의 광합성 실험</h1>

        <p class="subtitle">
            검은 점은 방사성 탄소(<sup>14</sup>C)가 검출된 물질을 나타냅니다. 시간에 따라 방사성 탄소가 어떤 물질로 이동하는지 관찰해 보세요.
        </p>

    </header>


    <!-- =========================
         TIME TAB
    ========================== -->

    <nav class="time-tabs" aria-label="시간 선택">

        <button
            type="button"
            class="time-tab active"
            data-step="3s">

            광합성 3초 후

        </button>

        <button
            type="button"
            class="time-tab"
            data-step="30s">

            광합성 30초 후

        </button>

    </nav>


<main>
    <section class="film-section">
        <div id="film" aria-label="광합성 실험 오토라디오그램"></div>
    </section>

    <section class="quiz-section">
        <h3>탐구 퀴즈</h3>
        <p id="quiz-progress"></p>

        <div id="quiz-question"></div>
        <div id="quiz-options"></div>

        <p id="quiz-feedback"></p>

        <div class="quiz-nav">
            <button id="quizNextBtn" type="button">다음 문제</button>
        </div>
<button id="submitBtn" type="button">
    답안 제출
</button>
    </section>
</main>



</div>

<script src="script.js"></script>

</body>

</html>
